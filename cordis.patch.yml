# Task Coordinator: cross-task coordination tools for supervisor agents.
# Mounted as an isolated plugin group so a fault cannot take down the host.
#
# 0.27.0: the external task bridge (former standalone dsh-plugin-task-bridge)
# is merged into this plugin behind the GUI experimental toggle (bridgeEnabled
# in the 任务编排 settings section; design + frozen wire contract:
# research/bridge-merge-into-coordinator-design.md). The 0.24.0 cross-group
# isolate seam ('dsh-task-bridge' shared label; docs/PROTOCOL.md §17) is
# RETIRED — the bridge now lives in-process and resolves the service through
# this group's own provide; no external consumer group remains.
- insert:
    - id: task-coordinator
      name: '@deepseek-ai/cordis-plugin-group'
      group: true
      config:
        - id: task-coordinator-runtime
          name: 'dsh-plugin-task-coordinator'
